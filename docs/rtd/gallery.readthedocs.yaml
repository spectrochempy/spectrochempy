# Read the Docs configuration for the SpectroChemPy example gallery.
#
# This is the companion project of the main documentation. On Read the Docs,
# set the configuration file path of the gallery project to
# ``docs/rtd/gallery.readthedocs.yaml`` in the project dashboard
# (Admin > Settings > Advanced settings). All paths inside this file are
# relative to the repository root.
#
# NOTE: the project slug below must match the actual Read the Docs project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # sphinx-gallery uses pandoc to render the downloadable notebook versions.
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python -m pip install --upgrade pip
      # The plugin examples import the official plugin namespaces.
      - python -m pip install ".[docs,plugins]"
    build:
      html:
        - SCPY_DOCS_PROFILE=gallery
          SCPY_DOCS_MAIN_URL=https://spectrochempy.readthedocs.io
          python docs/make.py html --profile gallery --warning-is-error -j auto
