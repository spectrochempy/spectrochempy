name: Prepare a new release

# This workflow is adapted from
# https://github.com/thomaseizinger/github-action-gitflow-release-workflow/blob/dev/.github/workflows/draft-new-release.yml

on:
  workflow_dispatch:
    inputs:
      versionString:
        description: "The version we want to release (e.g. 0.4.2)"
        required: true
      confirm_zenodo_enabled:
        description: "Confirm Zenodo GitHub integration is ENABLED before creating the release PR (see maintainers/release-process.md)"
        required: true
        type: boolean
        default: false
      bypass_plugin_check:
        description: "Bypass the official plugin version constraint check (not recommended)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  Prepare_new_release:
    name: "Prepare a new release"
    runs-on: ubuntu-latest
    if: github.repository == 'spectrochempy/spectrochempy'

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check Zenodo integration is enabled
        run: |
          if [ "${{ inputs.confirm_zenodo_enabled }}" != "true" ]; then
            echo "::error::Zenodo GitHub integration must be ENABLED before preparing a core release."
            echo "::error::1. Go to https://zenodo.org/account/settings/github/"
            echo "::error::2. Verify (or toggle) the spectrochempy/spectrochempy repository is Enabled"
            echo "::error::3. Re-run this workflow with confirm_zenodo_enabled=true"
            echo "::error::See maintainers/release-process.md for details."
            exit 1
          fi
          echo "Zenodo enabled confirmation acknowledged."

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install json5 pyyaml
          python3 -m pip install "cffconvert @ git+https://github.com/citation-file-format/cffconvert@b6045d7"
          python3 -m pip install setuptools_scm

      - name: Check plugin version constraints compatibility
        run: |
          BYPASS=${{ inputs.bypass_plugin_check }}
          if [ "$BYPASS" = "true" ]; then
            python .github/workflows/scripts/check_plugin_core_compatibility.py \
              ${{ github.event.inputs.versionString }} --bypass
          else
            python .github/workflows/scripts/check_plugin_core_compatibility.py \
              ${{ github.event.inputs.versionString }}
          fi

      - name: Create or reset release branch
        run: git checkout -B release/${{ github.event.inputs.versionString }}

      - name: Initialize mandatory git config
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "GitHub Actions"

      - name: Update version in release notes, zenodo.json and CITATION.cff
        run: |
          python .github/workflows/scripts/update_version_and_release_notes.py ${{ github.event.inputs.versionString }}

      - name: Commit tracked files
        id: make-commit
        run: |
          git add -A
          git commit --no-verify --message "Prepare release ${{ github.event.inputs.versionString }}"
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Push release branch
        run: git push --force-with-lease origin release/${{ github.event.inputs.versionString }}

      - name: Create or reuse pull request into master
        id: release-pr
        env:
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.versionString }}
        run: |
          gh_api_with_fallback() {
            local method="$1"
            local endpoint="$2"
            shift 2

            local stdout_file
            local stderr_file
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            if GH_TOKEN="$APP_GH_TOKEN" gh api --method "$method" "$endpoint" "$@" >"$stdout_file" 2>"$stderr_file"; then
              cat "$stdout_file"
              rm -f "$stdout_file" "$stderr_file"
              return 0
            fi

            if grep -q "Resource not accessible by integration" "$stderr_file"; then
              echo "::warning::GitHub App token could not access $endpoint; retrying with github.token." >&2
              if GH_TOKEN="$FALLBACK_GH_TOKEN" gh api --method "$method" "$endpoint" "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              fi
            fi

            if [ -s "$stdout_file" ]; then
              cat "$stdout_file" >&2
            fi
            if [ -s "$stderr_file" ]; then
              cat "$stderr_file" >&2
            fi
            rm -f "$stdout_file" "$stderr_file"
            return 1
          }

          gh_api_app_only() {
            local method="$1"
            local endpoint="$2"
            shift 2

            local stdout_file
            local stderr_file
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            if GH_TOKEN="$APP_GH_TOKEN" gh api --method "$method" "$endpoint" "$@" >"$stdout_file" 2>"$stderr_file"; then
              cat "$stdout_file"
              rm -f "$stdout_file" "$stderr_file"
              return 0
            fi

            if [ -s "$stdout_file" ]; then
              cat "$stdout_file" >&2
            fi
            if [ -s "$stderr_file" ]; then
              cat "$stderr_file" >&2
            fi
            rm -f "$stdout_file" "$stderr_file"
            return 1
          }

          body_file="$RUNNER_TEMP/release-pr-body.md"
          cat > "$body_file" <<EOF
          Hi @${{ github.actor }}!

          This PR was created in response to a manual trigger of the release workflow
          here:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          I've updated the docs/whatsnew/*rst files, CITATION.cff, zenodo.json plus eventual
          changes on the requirements/environment files:
          ${{ steps.make-commit.outputs.commit }}.

          Auto-merge is enabled automatically by this workflow. The PR will merge with the
          normal repository requirements once the required checks and reviews pass.

          Publishing this release will trigger publishing on pypi, anaconda and zenodo.
          EOF

          pr_title="Release version $RELEASE_VERSION"
          pr_body="$(cat "$body_file")"

          pr_number="$(gh_api_app_only GET \
            "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:release/$RELEASE_VERSION&base=master" \
            --jq '.[0].number')"

          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            pr_url="$(gh_api_app_only GET "repos/${{ github.repository }}/pulls/$pr_number" --jq '.html_url')"
            gh_api_with_fallback PATCH \
              "repos/${{ github.repository }}/pulls/$pr_number" \
              -f title="$pr_title" \
              -f body="$pr_body" >/dev/null
            if ! gh_api_app_only POST \
              "repos/${{ github.repository }}/pulls/$pr_number/requested_reviewers" \
              -f "reviewers[]=${{ github.actor }}" >/dev/null; then
              echo "::warning::Could not add ${{ github.actor }} as reviewer on existing PR $pr_number."
            fi
          else
            pr_json="$(gh_api_with_fallback POST \
              "repos/${{ github.repository }}/pulls" \
              -f title="$pr_title" \
              -f body="$pr_body" \
              -f head="release/$RELEASE_VERSION" \
              -f base="master")"
            pr_number="$(printf '%s' "$pr_json" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["number"])')"
            pr_url="$(printf '%s' "$pr_json" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["html_url"])')"

            if ! gh_api_app_only POST \
              "repos/${{ github.repository }}/pulls/$pr_number/requested_reviewers" \
              -f "reviewers[]=${{ github.actor }}" >/dev/null; then
              echo "::warning::Could not add ${{ github.actor }} as reviewer on new PR $pr_number."
            fi
          fi

          if ! gh_api_with_fallback POST \
            "repos/${{ github.repository }}/issues/$pr_number/labels" \
            -f "labels[]=no-changelog" \
            -f "labels[]=non-standard-prefix" >/dev/null; then
            echo "::warning::Could not apply labels to release PR $pr_number."
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge on release PR
        id: auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          auto_merge_enabled=false
          if gh pr merge "${{ steps.release-pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --match-head-commit "${{ steps.make-commit.outputs.commit }}"; then
            auto_merge_enabled=true
          else
            echo "::warning::Failed to enable auto-merge for ${{ steps.release-pr.outputs.url }}."
            echo "::warning::Check that the repository setting 'Allow auto-merge' is enabled and that the spectrochempy-releaser app can manage pull requests."
            echo "::warning::The repository ruleset must also allow squash merges for master."
          fi

          echo "enabled=$auto_merge_enabled" >> "$GITHUB_OUTPUT"

          {
            echo "### Release PR prepared"
            echo
            echo "- PR: ${{ steps.release-pr.outputs.url }}"
            echo "- Head commit: ${{ steps.make-commit.outputs.commit }}"
            if [ "$auto_merge_enabled" = "true" ]; then
              echo "- Merge mode: auto-merge (squash)"
            else
              echo "- Merge mode: manual follow-up required (auto-merge could not be enabled)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
