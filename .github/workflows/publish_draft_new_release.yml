name: "Publish a draft new release"

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.repository == 'spectrochempy/spectrochempy'

    steps:
      - name: Extract version from branch name (for release branches)
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          VERSION=${BRANCH_NAME#release/}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate version and derive release metadata
        id: vsem
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        run: |
          python3 -m pip install --quiet packaging
          python3 .github/workflows/scripts/release_version.py validate "$RELEASE_VERSION"
          python3 .github/workflows/scripts/release_version.py describe "$RELEASE_VERSION" \
            > release_semantics.txt
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < release_semantics.txt

      - name: Create Release
        uses: thomaseizinger/create-release@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          tag_name: ${{ steps.vsem.outputs.tag }}
          name: SpectroChemPy v${{ env.RELEASE_VERSION }}
          draft: true
          prerelease: ${{ steps.vsem.outputs.prerelease }}
