name: "Publish a draft new release"

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.repository == 'spectrochempy/spectrochempy'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Secure pip bootstrap
        uses: ./.github/actions/verified-pip
      - name: Extract version from branch name (for release branches)
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          VERSION=${BRANCH_NAME#release/}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate version and derive release metadata
        id: vsem
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        run: |
          python3 -m pip install --quiet packaging
          python3 .github/workflows/scripts/release_version.py validate "$RELEASE_VERSION"
          python3 .github/workflows/scripts/release_version.py describe "$RELEASE_VERSION" \
            > release_semantics.txt
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < release_semantics.txt

      - name: Create Release
        uses: thomaseizinger/create-release@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          tag_name: ${{ steps.vsem.outputs.tag }}
          name: SpectroChemPy v${{ env.RELEASE_VERSION }}
          draft: true
          prerelease: ${{ steps.vsem.outputs.prerelease }}
          body: |
            The reviewed release notes for SpectroChemPy ${{ env.RELEASE_VERSION }} are available at:

            https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.merge_commit_sha }}/docs/sources/whatsnew/${{ steps.vsem.outputs.release_notes }}

      - name: Publish release branches
        if: ${{ steps.vsem.outputs.prerelease == 'false' }}
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          archive_branch="${{ steps.vsem.outputs.version }}"
          echo "Release commit: $RELEASE_COMMIT"

          # ``stable`` is the only moving branch: it always tracks the latest
          # final release. It must exist, and it must only ever move forward so
          # that re-running an older release workflow cannot rewind it.
          stable_sha="$(git ls-remote origin refs/heads/stable | cut -f1)"
          if [ -z "$stable_sha" ]; then
            echo "::error::Branch 'stable' does not exist; create it before publishing a release."
            exit 1
          fi
          if [ "$stable_sha" != "$RELEASE_COMMIT" ]; then
            if ! git merge-base --is-ancestor "$stable_sha" "$RELEASE_COMMIT"; then
              echo "::error::The release commit $RELEASE_COMMIT is not a descendant of 'stable' ($stable_sha); refusing to move 'stable' backwards."
              exit 1
            fi
          fi

          # The numeric archive branch is immutable: it is created once, at the
          # release commit, and never moved afterwards. Read the Docs exposes it
          # as the short version name (e.g. ``1.1.4``) in the version flyout.
          existing_sha="$(git ls-remote origin "refs/heads/$archive_branch" | cut -f1)"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$RELEASE_COMMIT" ]; then
              echo "::error::Branch '$archive_branch' already exists at $existing_sha; refusing to move an existing archive branch."
              exit 1
            fi
            echo "Branch '$archive_branch' already points to the release commit."
          else
            git push origin "$RELEASE_COMMIT:refs/heads/$archive_branch"
          fi

          if [ "$stable_sha" = "$RELEASE_COMMIT" ]; then
            echo "Branch 'stable' already points to the release commit."
          else
            git push \
              --force-with-lease="refs/heads/stable:$stable_sha" \
              origin "$RELEASE_COMMIT:refs/heads/stable"
          fi

          {
            echo "### Release branches updated"
            echo
            echo "- \`$archive_branch\` → \`$RELEASE_COMMIT\`"
            echo "- \`stable\` → \`$RELEASE_COMMIT\` (was \`$stable_sha\`)"
          } >> "$GITHUB_STEP_SUMMARY"
