name: Synchronize RTD release versions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the ten-release retention policy (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rtd-core-version-retention
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == 'spectrochempy/spectrochempy'
      && (github.event_name != 'release'
          || (startsWith(github.event.release.tag_name, 'spectrochempy-v')
              && github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/verified-pip
      - name: Install version parser
        run: python -m pip install packaging
      - name: Validate published Core tag
        if: github.event_name == 'release'
        env:
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: python .github/workflows/scripts/release_version.py stable-tag-version "$PUBLISHED_TAG"
      - name: Synchronize release versions
        env:
          SCPY_RTD_API_TOKEN: ${{ secrets.SCPY_RTD_API_TOKEN }}
          APPLY: ${{ github.event_name == 'release' || inputs.apply }}
        shell: bash
        run: |
          args=()
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          python .github/workflows/scripts/sync_rtd_versions.py "${args[@]}"
