name: Synchronize RTD release versions

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the ten-release retention policy (otherwise dry run)
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: true
    secrets:
      SCPY_RTD_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: rtd-core-version-retention
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'spectrochempy/spectrochempy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/verified-pip
      - name: Install version parser
        run: python -m pip install packaging
      - name: Synchronize release versions
        env:
          SCPY_RTD_API_TOKEN: ${{ secrets.SCPY_RTD_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          args=()
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          python .github/workflows/scripts/sync_rtd_versions.py "${args[@]}"
