# Read the Docs configuration for the integrated SpectroChemPy 1.1.1 site.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python -m pip install --upgrade pip
      - python -m pip install -e ".[docs]"
    post_install:
      - |
        for name in $(python -m spectrochempy.ci.install_plugins --list-names); do
          python -m pip install --no-deps -e "plugins/$name"
        done
      - python -m pip install osqp scipy numpy-quaternion tensorly
    build:
      html:
        - python docs/make.py html --warning-is-error -j auto
