# Read the Docs configuration for the integrated SpectroChemPy documentation.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # pandoc is required by nbsphinx to render the markdown cells of the
  # notebooks.
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      # The build needs the release tags, both for the version and for the
      # setuptools_scm version of the editable install below. Read the Docs
      # clones shallowly.
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python .github/actions/verified-pip/verified_pip.py
      # The ``plugins`` extra is deliberately NOT requested here: the
      # post_install job installs checkout plugins explicitly and installs
      # standalone plugins from their published distributions.
      - python -m pip install -e ".[docs,wavelets]"
      - python -m pip install "ipython==9.17.1" "jupyterlab==4.6.4" "notebook==7.6.3"
    post_install:
      # Install the plugins that remain in this checkout in editable mode so
      # a pull request that changes one documents the plugin it contains.
      - |
        for name in $(python -m spectrochempy.ci.install_plugins --list-names); do
          python -m pip install --no-deps -e "plugins/$name"
        done
      # Use the released NMR plugin for examples that require it.
      - python -m pip install "spectrochempy-nmr>=0.2,<0.5"
      # Runtime dependencies that --no-deps skips.
      - python -m pip install osqp scipy tensorly
    build:
      html:
        - >-
          if [ "${SCPY_RTD_DOCS_ARTIFACTS:-}" = 1 ] && [ "${READTHEDOCS_VERSION_TYPE:-}" != external ]; then
          SCPY_DOCS_TRACE=1 python -u -m docs.rtd_build; fi
        - >-
          if [ "${SCPY_RTD_DOCS_ARTIFACTS:-}" != 1 ] || [ "${READTHEDOCS_VERSION_TYPE:-}" = external ]; then
          SCPY_DOCS_TRACE=1 python -u -m docs.preexecute_notebooks prepare; fi
        - >-
          if [ "${SCPY_RTD_DOCS_ARTIFACTS:-}" != 1 ] || [ "${READTHEDOCS_VERSION_TYPE:-}" = external ]; then
          python -u -m docs.preexecute_notebooks execute gettingstarted/quickstart.ipynb; fi
        - >-
          if [ "${SCPY_RTD_DOCS_ARTIFACTS:-}" != 1 ] || [ "${READTHEDOCS_VERSION_TYPE:-}" = external ]; then
          python -u -m docs.preexecute_notebooks execute userguide/analysis/cross_validation.ipynb; fi
        - >-
          if [ "${SCPY_RTD_DOCS_ARTIFACTS:-}" != 1 ] || [ "${READTHEDOCS_VERSION_TYPE:-}" = external ]; then
          python -u -m docs.preexecute_notebooks execute userguide/analysis/fitting.ipynb; fi
        - >-
