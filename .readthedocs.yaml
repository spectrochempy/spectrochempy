# Read the Docs configuration for the main SpectroChemPy documentation.
#
# This project serves the guides, the notebooks and the API reference. The
# example gallery is published as a companion project, configured in
# docs/rtd/gallery.readthedocs.yaml.
#
# NOTE: the project slug below must match the actual Read the Docs project.
# The two projects link to each other through SCPY_DOCS_MAIN_URL and
# SCPY_DOCS_GALLERY_URL, which are set on the build command.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # pandoc is required by nbsphinx to render the markdown cells of the
  # notebooks.
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      # The build needs the release tags, and Read the Docs clones shallowly.
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python -m pip install --upgrade pip
      # ``plugins`` installs the official plugins so the API reference can
      # import their namespaces. The gallery project needs them as well.
      - python -m pip install ".[docs,plugins]"
    build:
      html:
        # ``make.py`` drives the whole build (notebook sync, gallery staging,
        # profile specific exclusions) and writes to
        # $READTHEDOCS_OUTPUT/html when that variable is set.
        - SCPY_DOCS_PROFILE=main
          SCPY_DOCS_GALLERY_URL=https://spectrochempy-gallery.readthedocs.io
          python docs/make.py html --profile main --warning-is-error -j auto
