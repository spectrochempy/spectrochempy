# Read the Docs configuration for the integrated SpectroChemPy documentation.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # pandoc is required by nbsphinx to render the markdown cells of the
  # notebooks.
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      # The build needs the release tags, both for the version and for the
      # setuptools_scm version of the editable install below. Read the Docs
      # clones shallowly.
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python .github/actions/verified-pip/verified_pip.py
      # The ``plugins`` extra is deliberately NOT requested here: the
      # post_install job installs checkout plugins explicitly and installs
      # standalone plugins from their published distributions.
      - python -m pip install -e ".[docs]"
      - python -m pip install "ipython==9.17.1" "jupyterlab==4.6.4" "notebook==7.6.3"
    post_install:
      # Install the plugins that remain in this checkout in editable mode so
      # a pull request that changes one documents the plugin it contains.
      - |
        for name in $(python -m spectrochempy.ci.install_plugins --list-names); do
          python -m pip install --no-deps -e "plugins/$name"
        done
      # NMR is maintained in a standalone repository. Its
      # public API pages are generated from the released distributions.
      - python -m pip install "spectrochempy-nmr>=0.2,<0.4"
      # Runtime dependencies that --no-deps skips.
      - python -m pip install osqp scipy tensorly
    build:
      html:
        # ``make.py`` drives the whole integrated build and writes to
        # $READTHEDOCS_OUTPUT/html when that variable is set.
        - SCPY_DOCS_TRACE=1 python -u -m docs.preexecute_notebooks prepare
        - python -u -m docs.preexecute_notebooks execute gettingstarted/quickstart.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/cross_validation.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/fitting.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/mcr_als.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/pca.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/peak_analysis_workflow.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/peak_finding.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/peak_integration.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/pipeline.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/analysis/pls.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/api/api.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/importexport/import.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/importexport/importJCAMPDX.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/importexport/importOMNIC.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/importexport/importOPUS.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/introduction/interface.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/introduction/introduction.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/introduction/mdcheatsheet.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/objects/dataset/dataset.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/objects/project/project.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/objects/units_and_masks.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/advanced.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/customization.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/overview.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/plot_types.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/preferences.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/plotting/styles.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/alignment.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/apodization.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/baseline.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/denoising.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/fourier.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/interferogram.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/math_operations.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/slicing.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/smoothing.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/td_baseline.ipynb
        - python -u -m docs.preexecute_notebooks execute userguide/processing/transformations.ipynb
        - python -u -m docs.preexecute_notebooks verify
        - SCPY_DOCS_PREEXECUTED=1 SCPY_DOCS_TRACE=1 python -u docs/make.py html --warning-is-error --no-sync --no-data -j auto
