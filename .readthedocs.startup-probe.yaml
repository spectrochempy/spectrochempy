version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - pandoc
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    install:
      - python .github/actions/verified-pip/verified_pip.py
      - python -m pip install -e ".[docs]"
      - python -m pip install "ipython==9.17.1" "jupyterlab==4.6.4" "notebook==7.6.3"
    post_install:
      - |
        for name in $(python -m spectrochempy.ci.install_plugins --list-names); do
          python -m pip install --no-deps -e "plugins/$name"
        done
      - python -m pip install "spectrochempy-nmr>=0.2,<0.3" "spectrochempy-hypercomplex>=0.2,<0.3"
      - python -m pip install osqp scipy numpy-quaternion tensorly
    build:
      html:
        - /bin/sh .github/workflows/scripts/rtd_startup_preflight.sh
        - python -I -S -u .github/workflows/scripts/rtd_supervisor_startup_probe.py compare --timeout 3
