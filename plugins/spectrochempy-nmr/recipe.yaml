context:
  name: spectrochempy-nmr
  version: "0.1.15"

package:
  name: "${{ name }}"
  version: "${{ version }}"

source:
  path: .

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - spectrochempy >=1.1.0,<2
    - numpy

tests:
  - script:
      - python -c "import importlib.util; assert importlib.util.find_spec('spectrochempy_nmr') is not None"

about:
  summary: "NMR readers and tools plugin for SpectroChemPy"
  description: |
    Official SpectroChemPy plugin providing vendor NMR data reading,
    a validated public 1D processing workflow, and ppm/Hz unit conversion
    contexts for SpectroChemPy.
  homepage: https://www.spectrochempy.fr
  license: LicenseRef-CeCILL-B
  license_file:
    - LICENSE
    - NMRGLUE_LICENSE.rst
  repository: https://github.com/spectrochempy/spectrochempy

extra:
  recipe-maintainers:
    - fernandezc
    - atravert
